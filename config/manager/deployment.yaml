apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-platform-operator-controller-manager
  namespace: kubernetes-platform-operator-system
  labels:
    app.kubernetes.io/name: kubernetes-platform-operator
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-platform-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-platform-operator
    spec:
      serviceAccountName: kubernetes-platform-operator-controller-manager
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - kubernetes-platform-operator
                topologyKey: kubernetes.io/hostname
      containers:
        - name: manager
          image: ghcr.io/<PERSONAL_GITHUB_USERNAME>/<PERSONAL_GITHUB_REPOSITORY>:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
