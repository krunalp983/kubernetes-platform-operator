name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub workflows with actionlint
        uses: rhysd/actionlint@v1

  lint-test-build:
    runs-on: ubuntu-24.04
    needs:
      - workflow-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module graph is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./api ./internal)
          if [[ -n "$unformatted" ]]; then
            echo "Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./api/... ./cmd/... ./internal/... -race -coverprofile=coverage.out

      - name: Build operator binary
        run: go build ./cmd/operator

  integration-tests:
    runs-on: ubuntu-24.04
    needs:
      - lint-test-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: go test ./test/integration/... -count=1 -v

  manifests-and-helm:
    runs-on: ubuntu-24.04
    needs:
      - lint-test-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Render kustomize install manifests
        run: kubectl kustomize config > /tmp/install.yaml

      - name: Lint and render Helm chart
        run: |
          helm lint charts/kubernetes-platform-operator
          helm template kubernetes-platform-operator charts/kubernetes-platform-operator --namespace kubernetes-platform-operator-system > /tmp/chart.yaml

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate rendered manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas /tmp/install.yaml
          kubeconform -strict -summary -ignore-missing-schemas /tmp/chart.yaml

  security:
    runs-on: ubuntu-24.04
    needs:
      - lint-test-build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Build test image
        run: |
          docker build -t kubernetes-platform-operator:ci \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) .

      - name: Scan filesystem and image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: kubernetes-platform-operator:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
